name: Rust geometry kernel

on:
  pull_request:
    paths:
      - "rust/geometry-kernel/**"
      - ".github/workflows/rust-geometry-kernel.yml"
      - "src/Mod/RustCad/**"
      - "src/Mod/CMakeLists.txt"
      - "cMake/FreeCAD_Helpers/InitializeFreeCADBuildOptions.cmake"
      - ".github/scripts/run_rustcad_gui_tests.py"
  push:
    branches: [main]
    paths:
      - "rust/geometry-kernel/**"
      - ".github/workflows/rust-geometry-kernel.yml"
      - "src/Mod/RustCad/**"
      - "src/Mod/CMakeLists.txt"
      - "cMake/FreeCAD_Helpers/InitializeFreeCADBuildOptions.cmake"
      - ".github/scripts/run_rustcad_gui_tests.py"
  workflow_dispatch:
    inputs:
      gui:
        description: Build and test the opt-in FreeCAD Rust GUI on Linux
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust/geometry-kernel
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing repository pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # existing repository pin
        with:
          python-version: "3.11"
      - name: Check Rust boundary and build corpus
        id: build
        run: |
          mkdir -p artifacts/checks
          rustup show active-toolchain
          cargo fmt --check 2>&1 | tee artifacts/checks/fmt.log
          cargo test --locked 2>&1 | tee artifacts/checks/tests.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee artifacts/checks/clippy.log
          cargo build --locked --example corpus 2>&1 | tee artifacts/checks/build.log
          cargo tree --locked -e normal > artifacts/checks/dependency-tree.txt
          cargo metadata --locked --format-version 1 > artifacts/checks/dependencies.json
          ldd target/debug/examples/corpus > artifacts/checks/runtime-links.txt
          if grep -Ei 'lib(TK[A-Z]|occt|OpenCASCADE)' artifacts/checks/runtime-links.txt; then
            exit 1
          fi
      - name: Install independent OCCT validator
        run: python -m pip install -r requirements-validator.txt black==26.5.1
      - name: Check Python formatting
        run: python -m black --check --line-length 100 run_corpus.py validate_step.py test_validator.py validate_features.py test_features.py validate_gui.py ../../src/Mod/RustCad ../../.github/scripts/run_rustcad_gui_tests.py
      - name: Prove raw-import controls
        run: python -m unittest -v test_validator test_features 2>&1 | tee artifacts/checks/validator-controls.log
      - name: Run fixed corpus and raw STEP comparison
        run: python run_corpus.py artifacts/corpus 2>&1 | tee artifacts/checks/corpus.log
      - name: Prove all diagnostic features survive
        run: python validate_features.py artifacts/corpus --output artifacts/corpus/feature-resolution.json
      - name: Check out pinned upstream test sources
        if: always() && steps.build.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Yis-company/ogeom-rs
          ref: 9c49094f4d416c32a65967b926f96cc992ec4e47
          path: .codex/upstream-ogeom
          persist-credentials: false
      - name: Run relevant upstream geometry tests
        if: always() && steps.build.outcome == 'success'
        run: |
          timeout 600s cargo test --locked --manifest-path ../../.codex/upstream-ogeom/Cargo.toml -p ogeom -p ogeom-intersect --test preserve_analytic 2>&1 | tee artifacts/checks/upstream-preserving.log
          timeout 600s cargo test --locked --manifest-path ../../.codex/upstream-ogeom/Cargo.toml -p ogeom-bool --lib arrange::tests 2>&1 | tee artifacts/checks/upstream-arrangement.log
          for test in boxes_touching_along_an_edge_or_at_a_corner_share_no_volume a_solid_cut_by_its_own_copy_leaves_nothing a_cylinder_inscribed_in_a_box_is_read_off_its_contact_lines; do
            timeout 600s cargo test --locked --manifest-path ../../.codex/upstream-ogeom/Cargo.toml -p ogeom --test boolean_contact "$test" -- --exact 2>&1 | tee "artifacts/checks/upstream-$test.log"
          done
      - name: Retain evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # existing repository pin
        with:
          name: rust-geometry-kernel-evidence
          path: rust/geometry-kernel/artifacts/
          if-no-files-found: error

  gui:
    if: github.event_name == 'workflow_dispatch' && inputs.gui
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.1
          locked: true
      - name: Install the pinned Rust build toolchain
        working-directory: rust/geometry-kernel
        run: |
          rustcad_toolchain=$(pixi run --locked python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$rustcad_toolchain" --profile minimal --component rustfmt --component clippy
      - name: Configure and build the real GUI
        run: |
          mkdir -p build/evidence
          CFLAGS='' CXXFLAGS='' DEBUG_CFLAGS='' DEBUG_CXXFLAGS='' pixi run --locked cmake --preset conda-linux-release -DBUILD_RUSTCAD=ON -DFREECAD_PARALLEL_COMPILE_JOBS:STRING=2 -DFREECAD_PARALLEL_LINK_JOBS:STRING=1 > build/evidence/configure.log 2>&1
          pixi run --locked cmake --build build/release --parallel 2 > build/evidence/build.log 2>&1
          ldd build/release/Mod/RustCad/rustcad-engine > build/evidence/engine-links.txt
          if grep -Ei 'lib(TK[A-Z]|occt|OpenCASCADE)' build/evidence/engine-links.txt; then
            exit 1
          fi
      - name: Require registered and executed GUI lifecycle tests
        run: pixi run --locked xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" python .github/scripts/run_rustcad_gui_tests.py build/release/bin/FreeCAD build/evidence/gui > build/evidence/gui-run.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Independently validate the GUI-produced STEP
        run: |
          python -m venv build/reference-validator
          build/reference-validator/bin/python -m pip install -r rust/geometry-kernel/requirements-validator.txt
          rustcad_gui_folder=$(python -c 'import json; print(json.load(open("build/evidence/gui-run.json"))["artifacts"])')
          build/reference-validator/bin/python rust/geometry-kernel/validate_gui.py "$rustcad_gui_folder" --output build/evidence/gui-step-validation.json
      - name: Retain GUI evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustcad-gui-evidence
          path: build/evidence/
          if-no-files-found: error
